[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "business-entity-resolution"
version = "0.1.0"
description = "Amazon ML Challenge 2026: match noisy business records across 3 sources (macro F0.5)"
requires-python = ">=3.12"
# Ranges here; exact tested versions are pinned in requirements.txt.
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "pyarrow>=20",  # Arrow-backed strings: ~12M records per split must fit in RAM
    "scikit-learn>=1.9",  # blocking.py: TfidfVectorizer for the top-k retrieval passes
    "scipy>=1.18",  # blocking.py: sparse matrices between TF-IDF and sparse_dot_topn
    "sparse-dot-topn>=1.2",  # blocking.py: chunked sparse top-k cosine retrieval
]

[project.optional-dependencies]
notebooks = ["ipykernel", "nbconvert", "nbformat"]
dev = ["pytest", "ruff", "jupytext"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
