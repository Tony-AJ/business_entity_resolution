[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "business-entity-resolution"
version = "0.1.0"
description = "Amazon ML Challenge 2026: match noisy business records across 3 sources (macro F0.5)"
requires-python = ">=3.12"
# Ranges here; exact tested versions are pinned in requirements.txt.
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "pyarrow>=20",  # Arrow-backed strings: ~12M records per split must fit in RAM
    "psutil>=5",
    "anyascii>=0.3",          # transliteration of Indic-script names (ISC)
    "rapidfuzz>=3",           # pairwise string similarities (MIT)
    "scikit-learn>=1.5",      # TF-IDF vectorisers, calibration utilities (BSD-3)
    "scipy>=1.13",
    "sparse-dot-topn>=1.1",   # multi-threaded sparse top-k retrieval for blocking (Apache-2.0)
    "lightgbm>=4.5",          # pairwise matcher (MIT)
]

[project.optional-dependencies]
notebooks = ["ipykernel", "nbconvert", "nbformat"]
dev = ["pytest", "ruff", "jupytext"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
